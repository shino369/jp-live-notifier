<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="pageTitleInbox">Oshi Live Alert — Inbox</title>
    <link rel="stylesheet" href="material.css" />
    <link rel="stylesheet" href="items.css" />
    <link rel="stylesheet" href="inbox.css" />
  </head>
  <body>
    <header class="top-app-bar">
      <h1 class="title" data-i18n="appName">Oshi Live Alert</h1>
      <span id="status" class="body-medium on-surface-variant"></span>
      <div id="tools" class="actions"></div>
    </header>
    <section
      id="list-pane"
      class="pane"
      aria-label="Notifications"
      data-i18n-aria-label="notifications"
    >
      <label class="search-bar">
        <span id="search-icon"></span>
        <input
          id="search"
          type="search"
          placeholder="Search notifications"
          aria-label="Search notifications"
          data-i18n-placeholder="searchNotifications"
          data-i18n-aria-label="searchNotifications"
        />
      </label>
      <nav
        id="filters"
        class="chips"
        aria-label="Filter"
        data-i18n-aria-label="filter"
      ></nav>
      <div
        id="list"
        class="list"
        role="listbox"
        aria-label="Notifications"
        data-i18n-aria-label="notifications"
      ></div>
    </section>
    <main id="detail" class="pane"></main>
    <dialog id="clear-dialog" class="dialog">
      <form method="dialog">
        <h2 data-i18n="clearDialogTitle">Delete read notifications?</h2>
        <p id="clear-text"></p>
        <div class="actions">
          <button class="btn text state" value="cancel" data-i18n="cancel">
            Cancel
          </button>
          <button
            id="clear-ok"
            class="btn text state"
            value="ok"
            data-i18n="delete"
          >
            Delete
          </button>
        </div>
      </form>
    </dialog>
    <dialog id="ticket-dialog" class="dialog" aria-labelledby="ticket-heading">
      <form id="ticket-form">
        <h2 id="ticket-heading" data-i18n="ticketPerformance">
          Your performance
        </h2>
        <div class="ticket-fields">
          <label for="ticket-date">
            <span data-i18n="ticketDate">Performance date</span>
            <input
              id="ticket-date"
              name="date"
              type="date"
              list="ticket-dates"
            />
          </label>
          <datalist id="ticket-dates"></datalist>
          <label for="ticket-time">
            <span data-i18n="ticketTime">Start time (Japan time)</span>
            <input id="ticket-time" name="time" type="time" />
          </label>
        </div>
        <p class="body-medium" data-i18n="ticketPerformanceHelp">
          Check the date and start time on your ticket. You can add them later.
        </p>
        <p id="ticket-error" role="alert"></p>
        <div class="actions">
          <button
            id="ticket-undo"
            class="btn text state"
            type="button"
            data-i18n="ticketUndo"
          >
            Undo ticket purchase mark
          </button>
          <button
            id="ticket-cancel"
            class="btn text state"
            type="button"
            data-i18n="cancel"
          >
            Cancel
          </button>
          <button
            id="ticket-save"
            class="btn filled state"
            type="submit"
            data-i18n="ticketSave"
          >
            Save
          </button>
        </div>
      </form>
    </dialog>
    <script type="module" src="inbox.js"></script>
  </body>
</html>
