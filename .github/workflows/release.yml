# Build the extension zip and publish a GitHub release, from the Actions tab:
# Actions → Release → Run workflow. Only from main.
#
# The version comes from extension/manifest.json. "auto" (the default)
# releases it as is while its tag vX.Y.Z does not exist yet (the first
# release, or a new run after one that failed before tagging), else bumps the
# patch number; "patch", "minor", "major" always bump; "none" never does. A
# bump is committed to main as "chore(release): vX.Y.Z". The tag is created
# with the release; an existing tag stops the run.
#
# Then the "store" job submits the release's zip to the Chrome Web Store for
# review (store: "publish" goes live once approved, "staged" waits after
# approval for a manual publish in the Developer Dashboard, "skip" does not
# submit). A pre-release is never submitted. If the submission fails, the
# GitHub release stays: fix the cause (a new permission needs its
# justification in the Dashboard first, see store/README.md), then use
# "Re-run failed jobs" on the run, which runs only the store job again, or
# Actions → Store → submit. "Re-run all jobs" stops at the existing tag.
# Needs the secrets CWS_SERVICE_ACCOUNT_KEY and CWS_PUBLISHER_ID in the
# chrome-web-store environment, limited to main (README → Chrome Web Store).
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto = the manifest version if not released yet, else the next patch)
        type: choice
        options: [auto, patch, minor, major, none]
        default: auto
      notes:
        description: Release notes in Markdown (type \n for a new line). GitHub's list of changes is added below.
        type: string
        required: false
      prerelease:
        description: Mark as a pre-release (never submitted to the Chrome Web Store)
        type: boolean
        default: false
      store:
        description: Chrome Web Store (publish = live once approved, staged = publish by hand after approval, skip = GitHub only)
        type: choice
        options: [publish, staged, skip]
        default: publish

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha256: ${{ steps.zip.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pnpm (version from package.json)
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Quality gate (lint, format, types, unit tests)
        run: pnpm check

      - name: Set the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          before="$(node -p "require('./extension/manifest.json').version")"
          # release.mjs refuses a version whose tag exists and says how to
          # retry; show its first line as the run's error too.
          if ! version="$(node scripts/release.mjs bump "$BUMP" 2>bump.err)"; then
            cat bump.err >&2
            # Escaped as workflow commands require (%, CR, LF).
            first="$(head -n 1 bump.err | tr -d '\r')"
            first="${first//%/%25}"
            echo "::error::$first See this step's log for how to retry."
            exit 1
          fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$version" != "$before" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Commit the version bump
        if: steps.version.outputs.changed == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore(release): $TAG"
          git push origin HEAD:main

      - name: Build the zip
        id: zip
        run: |
          path="$(node scripts/release.mjs package)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          # The store job checks the release's zip against this, so it
          # submits only what this job built.
          echo "sha256=$(sha256sum "$path" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
        run: node scripts/release.mjs notes > dist/notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ZIP: ${{ steps.zip.outputs.path }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(--title "$TAG" --notes-file dist/notes.md --generate-notes --target "$(git rev-parse HEAD)")
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" "$ZIP" "${args[@]}"

  store:
    # Its own job, so "Re-run failed jobs" retries only the submission: the
    # release job's outputs are kept, and the zip comes from the release.
    needs: release
    if: inputs.store != 'skip' && !inputs.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The store secrets are environment secrets: only runs on main get them.
    environment: chrome-web-store
    permissions:
      contents: read
    # No concurrency group shared with Actions → Store: GitHub keeps one
    # pending run per group and cancels the older one, which would drop this
    # submission silently. Do not run Actions → Store while this job runs.
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The script uses only Node's built-in modules: no install needed.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download the release zip
        id: zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          SHA256: ${{ needs.release.outputs.sha256 }}
        run: |
          gh release download "$TAG" --pattern '*.zip' --dir dist
          zips=(dist/*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::$TAG has ${#zips[@]} zip files; expected one."
            exit 1
          fi
          if ! echo "$SHA256  ${zips[0]}" | sha256sum -c -; then
            echo "::error::$TAG's zip is not the one the release job built (it changed since). Submit it with Actions → Store → submit if that is intended."
            exit 1
          fi
          echo "path=${zips[0]}" >> "$GITHUB_OUTPUT"

      - name: Submit to the Chrome Web Store
        id: store
        env:
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          ZIP: ${{ steps.zip.outputs.path }}
          STORE: ${{ inputs.store }}
        run: |
          args=(submit "$ZIP")
          if [ "$STORE" = "staged" ]; then args+=(--staged); fi
          node scripts/publish-store.mjs "${args[@]}"

      - name: Explain how to resubmit
        if: failure() && steps.store.outcome == 'failure'
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: echo "::error::The GitHub release $TAG is published, but the Chrome Web Store submission failed (see the step above). After fixing the cause, use Re-run failed jobs on this run (it runs only this job again), or Actions → Store → submit with tag $TAG."
