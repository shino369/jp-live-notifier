# Build the extension zip and publish a GitHub release, from the Actions tab:
# Actions → Release → Run workflow. Only from main.
#
# The version comes from extension/manifest.json. "auto" (the default)
# releases it as is while its tag vX.Y.Z does not exist yet (the first
# release, or a re-run after a failed run), else bumps the patch number;
# "patch", "minor", "major" always bump; "none" never does. A bump is
# committed to main as "chore(release): vX.Y.Z". The tag is created with the
# release; an existing tag stops the run.
#
# Then the zip is submitted to the Chrome Web Store for review (store:
# "publish" goes live once approved, "staged" waits after approval for a
# manual publish in the Developer Dashboard, "skip" does not submit). A
# pre-release is never submitted. If the submission fails, the GitHub release
# stays; resubmit it with Actions → Store → submit. Needs the secrets
# CWS_SERVICE_ACCOUNT_KEY and CWS_PUBLISHER_ID (README → Chrome Web Store).
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto = the manifest version if not released yet, else the next patch)
        type: choice
        options: [auto, patch, minor, major, none]
        default: auto
      notes:
        description: Release notes in Markdown (type \n for a new line). GitHub's list of changes is added below.
        type: string
        required: false
      prerelease:
        description: Mark as a pre-release (never submitted to the Chrome Web Store)
        type: boolean
        default: false
      store:
        description: Chrome Web Store (publish = live once approved, staged = publish by hand after approval, skip = GitHub only)
        type: choice
        options: [publish, staged, skip]
        default: publish

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pnpm (version from package.json)
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Quality gate (lint, format, types, unit tests)
        run: pnpm check

      - name: Set the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          before="$(node -p "require('./extension/manifest.json').version")"
          version="$(node scripts/release.mjs bump "$BUMP")"
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists. Choose a bump, or raise the version in extension/manifest.json."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$version" != "$before" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Commit the version bump
        if: steps.version.outputs.changed == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore(release): $TAG"
          git push origin HEAD:main

      - name: Build the zip
        id: zip
        run: echo "path=$(node scripts/release.mjs package)" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
        run: node scripts/release.mjs notes > dist/notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ZIP: ${{ steps.zip.outputs.path }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(--title "$TAG" --notes-file dist/notes.md --generate-notes --target "$(git rev-parse HEAD)")
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" "$ZIP" "${args[@]}"

      - name: Submit to the Chrome Web Store
        id: store
        if: inputs.store != 'skip' && !inputs.prerelease
        env:
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          ZIP: ${{ steps.zip.outputs.path }}
          STORE: ${{ inputs.store }}
        run: |
          args=(submit "$ZIP")
          if [ "$STORE" = "staged" ]; then args+=(--staged); fi
          node scripts/publish-store.mjs "${args[@]}"

      - name: Explain how to resubmit
        if: failure() && steps.store.outcome == 'failure'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: echo "::error::The GitHub release $TAG is published, but the Chrome Web Store submission failed (see the step above). After fixing the cause, run Actions → Store → submit with tag $TAG."
